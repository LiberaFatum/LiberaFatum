name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/stats-cards.yml]

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # STATS_TOKEN: classic PAT (repo, read:user) so aggregated private contributions
      # and private repo languages are counted. Without it only public data is used.
      STATS_OPTS: username=LiberaFatum&show_icons=true&include_all_commits=true&count_private=true&hide_rank=true&hide_border=true&show=prs_merged,reviews&custom_title=GitHub%20activity
      LANGS_OPTS: username=LiberaFatum&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&hide=html,jupyter%20notebook&hide_border=true&custom_title=Languages
    steps:
      - uses: actions/checkout@v6

      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS_OPTS }}&theme=dark_github
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS_OPTS }}&theme=light_github
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS_OPTS }}&theme=dark_github
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS_OPTS }}&theme=light_github
          path: profile/top-langs-light.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
